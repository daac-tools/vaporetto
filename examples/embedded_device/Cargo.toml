[package]
name = "vaporetto_embedded_device"
edition = "2021"
version = "0.1.0"

[dependencies]
cortex-m = { version = "0.7.9", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
cortex-m-semihosting = "0.6.0"
panic-halt = "1.0.0"

vaporetto = { path = "../../vaporetto", default-features = false }
vaporetto_rules = { path = "../../vaporetto_rules" }

embedded-alloc = { version = "0.7.0", default-features = false, features = ["llff"] }

[build-dependencies]
vaporetto = { path = "../../vaporetto", default-features = false, features = ["alloc"] }
ruzstd = "0.9.0"  # MIT

[profile.release]
codegen-units = 1
debug = true
lto = true
