[package]
name = "convert_bincode_model"
version = "0.1.0"
edition = "2021"

[dependencies]
bincode = { version = "2.0.1", features = ["derive"] }  # MIT
clap = { version = "4.6", features = ["derive"] }  # MIT or Apache-2.0
postcard = { version = "1.1.3", features = ["use-std"] }  # MIT or Apache-2.0
serde = { version = "1.0.228", features = ["derive"] }  # MIT or Apache-2.0
vaporetto = { path = "../vaporetto" }  # MIT or Apache-2.0
zstd = { version = "0.14.1", features = ["zstdmt"] }  # MIT
