[package]
name = "vaporetto"
version = "0.7.0"
edition = "2021"
rust-version = "1.88"
authors = ["Koichi Akabe <vbkaisetsu@gmail.com>"]
description = "Vaporetto: a pointwise prediction based tokenizer"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/daac-tools/vaporetto"
repository = "https://github.com/daac-tools/vaporetto"
readme = "README.md"
keywords = ["japanese", "analyzer", "tokenizer", "morphological"]
categories = ["text-processing", "no-std"]

[dependencies]
daachorse = "5.0.0"  # MIT or Apache-2.0
hashbrown = { version = "0.17.1", features = ["serde"] }  # MIT or Apache-2.0
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }  # MIT or Apache-2.0
serde = { version = "1.0.228", default-features = false, features = ["alloc", "derive"] }  # MIT or Apache-2.0

liblinear = { version = "1", optional = true }  # MIT

[features]
default = ["std", "cache-type-score", "fix-weight-length", "tag-prediction", "charwise-pma"]

# default: on
alloc = []
std = ["alloc", "postcard/use-std"]
cache-type-score = ["alloc"]
fix-weight-length = ["alloc"]
tag-prediction = ["alloc"]
charwise-pma = ["alloc"]

kytea = ["std"]
# The trainer needs the standard library for the logarithm (`f64::ln`) in the solver of logistic
# regression, which is not available in the core library.
train = ["std"]
liblinear = ["train", "dep:liblinear"]
portable-simd = ["fix-weight-length"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
